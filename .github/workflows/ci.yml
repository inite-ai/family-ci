# The family's CI, called from every family repo's thin .github/workflows/ci.yml:
#
#   on: { pull_request: {}, workflow_dispatch: {} }
#   jobs:
#     checks:
#       uses: inite-ai/family-ci/.github/workflows/ci.yml@main
#       secrets: inherit
#     ci:            # the check main requires
#       needs: checks
#       if: always()
#       runs-on: ubuntu-latest
#       steps:
#         - run: test "${{ needs.checks.result }}" = success
#
# It runs the same list the pre-commit hook runs (devops/standards/family/gate.sh),
# with the tests: lint, typecheck, test, [build], then `inite-standards check`
# against the PR's base. Its tools come from the copy of inite-shared the
# runner downloads for the `family` action, so the repo needs no token for them.
#
# Two security jobs run beside the gate (.planning/family-security-baseline-2026-10.md):
#   secrets - gitleaks over the PR's own commits (a leak in history is a
#             rotation, reported by the weekly scan; a new one stops here);
#   audit   - High/Critical advisories in prod dependencies fail, unless
#             named in .inite/audit-allow.json with a reason and an expiry.
#
# Secrets it reads when the caller passes `secrets: inherit`:
#   SUBMODULE_TOKEN or SUBMODULE_SSH_KEY - to clone the private inite-shared submodule.
name: family ci

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version when the repo has no .nvmrc (the family default is 22).
        type: string
        default: '22'
      python-version:
        description: Python version when the repo has no .python-version.
        type: string
        default: '3.13'
      prepare:
        description: A command after the install and before the checks (build the shared packages, generate a client).
        type: string
        default: ''
      build:
        description: Run the build script too.
        type: boolean
        default: false
      postgres:
        description: Start a throwaway Postgres 16 (postgres/postgres@localhost:5432/test) for the tests.
        type: boolean
        default: false
      env:
        description: KEY=value lines (not secrets) exported for every step, e.g. DATABASE_URL for the tests.
        type: string
        default: ''
      timeout-minutes:
        type: number
        default: 30
      audit-enforce-from:
        description: The day High/Critical advisories in prod dependencies start failing (before it they are reported). The family switches on 2026-11-16.
        type: string
        default: '2026-11-16'

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    services:
      postgres:
        image: ${{ inputs.postgres && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Environment
        if: inputs.env != ''
        env:
          LINES: ${{ inputs.env }}
        run: printf '%s\n' "$LINES" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' >> "$GITHUB_ENV"

      - name: inite-shared submodule
        if: hashFiles('.gitmodules') != ''
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
          SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
        run: |
          if [ -n "$SUBMODULE_TOKEN" ]; then
            git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          elif [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh && printf '%s\n' "$SUBMODULE_SSH_KEY" > ~/.ssh/id_submodule && chmod 600 ~/.ssh/id_submodule
            ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
            git config --global core.sshCommand "ssh -i ~/.ssh/id_submodule -o IdentitiesOnly=yes"
            git config --global url."git@github.com:".insteadOf "https://github.com/"
          else
            echo "::error::the repo has submodules but neither SUBMODULE_TOKEN nor SUBMODULE_SSH_KEY reached the workflow (secrets: inherit?)"
            exit 1
          fi
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Family tools
        uses: inite-ai/family-ci/.github/actions/family@main

      - name: What this repo is
        id: repo
        run: |
          std="node $INITE_FAMILY_DIR/bin/inite-standards.mjs"
          echo "profile=$($std profile)" >> "$GITHUB_OUTPUT"
          echo "pm=$($std pm)" >> "$GITHUB_OUTPUT"
          if [ -f .nvmrc ]; then echo "node=$(tr -d 'v \n' < .nvmrc)"; else echo "node=${{ inputs.node-version }}"; fi >> "$GITHUB_OUTPUT"
          if [ -f .python-version ]; then echo "python=$(tr -d ' \n' < .python-version)"; else echo "python=${{ inputs.python-version }}"; fi >> "$GITHUB_OUTPUT"

      - name: pnpm
        if: steps.repo.outputs.profile != 'python' && steps.repo.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.repo.outputs.node }}
          cache: ${{ steps.repo.outputs.profile != 'python' && steps.repo.outputs.pm || '' }}

      - name: Install (the lockfile must be in sync)
        if: steps.repo.outputs.profile != 'python'
        run: |
          case "${{ steps.repo.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            *) npm ci ;;
          esac

      - name: Python
        if: steps.repo.outputs.profile == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.repo.outputs.python }}
          cache: pip

      - name: Install (python)
        if: steps.repo.outputs.profile == 'python'
        run: |
          python -m pip install --upgrade pip
          for f in requirements.txt requirements-dev.txt; do [ -f "$f" ] && pip install -r "$f"; done
          pip install ruff mypy pytest

      - name: Prepare
        if: inputs.prepare != ''
        run: ${{ inputs.prepare }}

      - name: Gate
        env:
          GATE_SCOPE: full
          GATE_BUILD: ${{ inputs.build && '1' || '0' }}
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: sh "$INITE_FAMILY_DIR/family/gate.sh" "origin/$BASE"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (pinned binary, checksum verified)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
      - name: No secret in this change
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          # Only the commits this PR adds; the values are never printed (--redact).
          range="origin/${BASE}..HEAD"
          git rev-parse -q --verify "origin/${BASE}" >/dev/null || range="HEAD~1..HEAD"
          /tmp/gitleaks git --redact --no-banner --log-opts="$range" --exit-code 1 . || {
            echo "::error::a secret-shaped string is in this change. Remove it, rotate the secret (it is in the PR's history now), and squash the commit away."
            exit 1
          }

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Family tools
        uses: inite-ai/family-ci/.github/actions/family@main
      - name: What this repo is
        id: repo
        run: |
          std="node $INITE_FAMILY_DIR/bin/inite-standards.mjs"
          echo "profile=$($std profile)" >> "$GITHUB_OUTPUT"
          echo "pm=$($std pm)" >> "$GITHUB_OUTPUT"
      - name: pnpm
        if: steps.repo.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: High and Critical in what ships
        if: steps.repo.outputs.profile != 'python'
        env:
          FROM: ${{ inputs.audit-enforce-from }}
        run: |
          # The audit reads the lockfile against the advisory database; no install is needed.
          if node "$INITE_FAMILY_DIR/bin/inite-standards.mjs" audit; then exit 0; fi
          if [ "$(date -u +%F)" \< "$FROM" ]; then
            echo "::warning::High/Critical advisories above; this fails from $FROM. Upgrade, or allow in .inite/audit-allow.json with a reason and an expiry."
            exit 0
          fi
          exit 1
      - name: Python (pip-audit)
        if: steps.repo.outputs.profile == 'python'
        env:
          FROM: ${{ inputs.audit-enforce-from }}
        run: |
          pip install --quiet pip-audit
          ok=0
          for f in requirements.txt; do [ -f "$f" ] && { pip-audit -r "$f" --strict --progress-spinner off || ok=1; }; done
          if [ "$ok" = 0 ]; then exit 0; fi
          if [ "$(date -u +%F)" \< "$FROM" ]; then echo "::warning::vulnerable Python dependencies; this fails from $FROM."; exit 0; fi
          exit 1
