# Called last by every family deploy workflow, from outside the host:
#
#   verify:
#     needs: deploy
#     uses: inite-ai/family-ci/.github/workflows/verify-deploy.yml@main
#     with:
#       urls: https://inite.shop https://inite.shop/api/health
#
# Each URL must answer below 400 within the timeout (redirects are not
# followed: a 3xx is an answer). With `expect`, the first URL's body must
# contain it.
#
# With `expect-build: ${{ github.sha }}`, the first URL's site must report
# that commit at `version-path` (default /api/version): "something answered"
# is not "this release answered" - a stale or wrong container passes the
# first check, not this one. With `www: true`, https://www.<host>/ must answer
# a 301/308 to https://<host>/ with no port (www.inite.education and
# www.inite.club sent people to :3000 on 31.10.2026). deploy-compose.yml
# passes all three.
#
# Then the first URL's site is read the way an attacker reads it
# (inite-standards probe): HSTS, CSP without inline scripts, frame-ancestors,
# referrer and permissions policy, cookie flags, and /.env, /.git, source
# maps not served. Reported as warnings; `probe-enforce: true` fails the
# deploy on them (the family baseline makes it the default once a site
# mounts securityHeaders()).
name: family verify deploy

on:
  workflow_call:
    inputs:
      urls:
        description: URLs, space or newline separated.
        type: string
        required: true
      expect:
        description: Text the first URL's body must contain.
        type: string
        default: ''
      expect-build:
        description: The commit the first URL's site must report at version-path (deploy-compose passes the released sha).
        type: string
        default: ''
      version-path:
        description: Where the site reports its build (JSON or text containing the commit).
        type: string
        default: /api/version
      www:
        description: The www twin of the first URL's host must answer a permanent redirect to the https apex, with no port.
        type: boolean
        default: false
      timeout-seconds:
        type: number
        default: 300
      probe-enforce:
        description: Fail the deploy when the security probe finds a problem (otherwise warnings).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Production answers
        env:
          URLS: ${{ inputs.urls }}
          EXPECT: ${{ inputs.expect }}
          TIMEOUT: ${{ inputs.timeout-seconds }}
        run: |
          set -u
          deadline=$(( $(date +%s) + TIMEOUT ))
          first=1
          status=0
          for url in $URLS; do
            while :; do
              code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 -A 'inite-verify-deploy/1' "$url" 2>/dev/null || echo 000)
              ok=0
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
                ok=1
                if [ "$first" = 1 ] && [ -n "$EXPECT" ] && ! grep -qF "$EXPECT" /tmp/body; then ok=0; fi
              fi
              if [ "$ok" = 1 ]; then echo "✓ $url $code"; break; fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::$url answered $code${EXPECT:+ (expected text: $EXPECT)} until the timeout"
                status=1
                break
              fi
              sleep 10
            done
            first=0
          done
          exit "$status"

      - name: This release answers
        if: inputs.expect-build != ''
        env:
          URLS: ${{ inputs.urls }}
          SHA: ${{ inputs.expect-build }}
          VERSION_PATH: ${{ inputs.version-path }}
          TIMEOUT: ${{ inputs.timeout-seconds }}
        run: |
          set -u
          first=$(printf '%s' "$URLS" | awk '{print $1; exit}')
          origin=$(printf '%s' "$first" | sed -E 's#^(https?://[^/]+).*#\1#')
          url="$origin$VERSION_PATH"
          deadline=$(( $(date +%s) + TIMEOUT ))
          while :; do
            body=$(curl -sS --max-time 20 -H 'cache-control: no-cache' -A 'inite-verify-deploy/1' "$url?v=$SHA" 2>/dev/null || true)
            if printf '%s' "$body" | grep -qF "$SHA"; then echo "✓ $url reports ${SHA:0:8}"; exit 0; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$url does not report $SHA (it said: $(printf '%s' "$body" | head -c 200))"
              exit 1
            fi
            sleep 10
          done

      - name: www goes to the apex at the edge
        if: inputs.www
        env:
          URLS: ${{ inputs.urls }}
        run: |
          set -u
          first=$(printf '%s' "$URLS" | awk '{print $1; exit}')
          host=$(printf '%s' "$first" | sed -E 's#^https?://([^/:]+).*#\1#')
          out=$(curl -sS -o /dev/null --max-time 20 -w '%{http_code} %{redirect_url}' -A 'inite-verify-deploy/1' "https://www.$host/x?q=1" 2>/dev/null || echo "000 ")
          code=${out%% *}
          to=${out#* }
          case "$code" in
            301 | 308) ;;
            *) echo "::error::https://www.$host/ answered $code, not a permanent redirect to https://$host/"; exit 1 ;;
          esac
          case "$to" in
            "https://$host/x?q=1") echo "✓ www.$host -> $to ($code)" ;;
            *) echo "::error::https://www.$host/x?q=1 redirects to $to, not https://$host/x?q=1 (a port, http or another host)"; exit 1 ;;
          esac

      - name: Family tools
        uses: inite-ai/family-ci/.github/actions/family@main
      - name: Security probe
        env:
          URLS: ${{ inputs.urls }}
          ENFORCE: ${{ inputs.probe-enforce && '1' || '0' }}
        run: |
          first=$(printf '%s' "$URLS" | awk '{print $1; exit}')
          origin=$(node -e 'console.log(new URL(process.argv[1]).origin)' "$first")
          if node "$INITE_FAMILY_DIR/bin/inite-standards.mjs" probe "$origin" > /tmp/probe.md; then
            cat /tmp/probe.md
            exit 0
          fi
          cat /tmp/probe.md >> "$GITHUB_STEP_SUMMARY"
          grep '^- ' /tmp/probe.md | sed 's/^- /::warning::/'
          [ "$ENFORCE" = 1 ] && exit 1 || exit 0
