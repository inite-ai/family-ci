# The head of a family deploy workflow: `gate`, the repo's own build, then the
# family deploy (inite-shared .github/workflows/deploy-compose.yml), which runs
# the release e2e on the image, deploys it pinned by commit, verifies it from
# outside and rolls back on its own. devops/workflow-templates/deploy.yml is
# the whole file. A repo still on its own deploy job keeps it between `gate`
# and a `verify` job (verify-deploy.yml with expect-build) until it moves.
name: Deploy

# PRODUCTION MOVES ON A RELEASE, NOT ON A MERGE (family standard, 29.10.2026).
# `sh scripts/family.sh release` publishes one; `workflow_dispatch` is the
# hotfix and rollback door (a dispatched tag that was released before passes
# the gate as it is).
on:
  release:
    types: [published]
  workflow_dispatch:

# One production, one queue. Never cancel a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    uses: inite-ai/inite-shared/.github/workflows/release-gate.yml@main
    permissions:
      contents: read
      checks: read
      pull-requests: read

  # build-and-push:
  #   needs: gate
  #   ... the repo's own build: push <image>:${{ github.sha }} only ...

  deploy:
    needs: gate # build-and-push, once it is there
    uses: inite-ai/inite-shared/.github/workflows/deploy-compose.yml@main
    secrets: inherit
    permissions:
      contents: read
    with:
      app: example
      image: example
      domains: example.inite www.example.inite
      e2e-command: sh scripts/release-e2e.sh
